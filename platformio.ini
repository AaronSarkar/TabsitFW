[env:seeed_xiao_esp32c3]
platform = espressif32@6.6.0
board = seeed_xiao_esp32c3
framework = arduino
upload_port = COM7
upload_speed = 115200
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI @ ^2.5
    lvgl/lvgl@^8.3
build_flags =
    -include include/tft_setup.h
    -DLV_CONF_INCLUDE_SIMPLE
build_src_filter = +<*> -<display/display.cpp>
