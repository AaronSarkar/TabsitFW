[env:seeed_xiao_esp32c3]
platform = espressif32@6.6.0
board = seeed_xiao_esp32c3
framework = arduino
upload_port = COM7
monitor_port = COM7
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
lib_deps =
    bodmer/TFT_eSPI @ ^2.5
    lvgl/lvgl@^8.3
build_flags =
    -include include/tft_setup.h
    -DLV_CONF_INCLUDE_SIMPLE
    ; Put the project include dir on the GLOBAL include path so the LVGL
    ; *library* build can find lv_conf.h. Without this, LVGL's
    ; `#include "lv_conf.h"` silently fails and it compiles with all
    ; defaults (notably LV_TICK_CUSTOM=0 -> no time source -> animations
    ; and auto-refresh/scrolling never render).
    -I include
    -DDIAG_LEVEL=2
build_src_filter = +<*> -<display/lvgl_display.cpp>
